name: Standalone build

# Builds and tests the plugin outside the JOSM plugins SVN tree, against JOSM
# artifacts from https://josm.openstreetmap.de/repository/.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its superseded run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build and test (JOSM latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn -B -U verify -Dplugin.version="$(git describe --tags --always --dirty)"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MapRoulette.jar
          path: target/MapRoulette.jar

  test-minimum:
    # JOSM publishes no josm or josm-unittest artifact for most revisions, and the Ant workflow's minimum-revision
    # run builds with this pom, which resolves the latest snapshot. So JOSM and its test kit are built from source at
    # Plugin-Mainversion, into a Maven repository of their own, and the plugin is built and tested against them.
    name: Build and test (JOSM minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actions/cache takes no '..' in its path, and the job env can't see the runner context
      - name: Set the JOSM repository path
        run: echo "MINIMUM_REPO=$RUNNER_TEMP/josm-minimum-m2" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Read Plugin-Mainversion
        id: minimum
        run: echo "revision=$(sed -n 's:.*<plugin.main.version>\([0-9]*\)</plugin.main.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"
      - name: Cache JOSM at Plugin-Mainversion
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MINIMUM_REPO }}
          key: josm-minimum-r${{ steps.minimum.outputs.revision }}-${{ hashFiles('pom.xml') }}
      - name: Build JOSM at Plugin-Mainversion
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          REVISION: ${{ steps.minimum.outputs.revision }}
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/JOSM/josm.git ../josm-core
          # The GitHub mirror keeps the SVN revision in each commit message
          commit=$(git -C ../josm-core log -1 --format=%H --grep="/trunk@${REVISION} ")
          if [ -z "$commit" ]; then
            echo "::error::No JOSM commit for r${REVISION}"
            exit 1
          fi
          git -C ../josm-core checkout -q "$commit"
          mvn -B -ntp -f ../josm-core/nodist/pom.xml -Dmaven.repo.local="$MINIMUM_REPO" install -DskipTests \
            -Dmaven.javadoc.skip=true -Dcheckstyle.skip -Dpmd.skip -Dspotbugs.skip -Djacoco.skip
          # Record what was built, so every run can check the jars it tests against
          {
            echo "revision=${REVISION}"
            echo "commit=${commit}"
            (cd "$MINIMUM_REPO" && sha256sum org/openstreetmap/josm/josm/*/josm-*.jar \
              org/openstreetmap/josm/josm-unittest/*/josm-unittest-*.jar)
          } > "$MINIMUM_REPO/josm-minimum.txt"
      - name: Build and test
        # No snapshot updates, so the JOSM built above is the one used
        run: mvn -B -ntp -nsu -Dmaven.repo.local="$MINIMUM_REPO" verify
      - name: Check the JOSM tested against
        # The jars must be the ones built from source at Plugin-Mainversion, not downloaded snapshots
        env:
          REVISION: ${{ steps.minimum.outputs.revision }}
        run: |
          cd "$MINIMUM_REPO"
          tee -a "$GITHUB_STEP_SUMMARY" < josm-minimum.txt
          grep -qx "revision=${REVISION}" josm-minimum.txt || { echo "::error::JOSM was not built at r${REVISION}"; exit 1; }
          grep -v = josm-minimum.txt | sha256sum -c
          for file in org/openstreetmap/josm/josm/*/_remote.repositories \
              org/openstreetmap/josm/josm-unittest/*/_remote.repositories; do
            if grep -E '\.jar>.+=' "$file"; then
              echo "::error::A JOSM jar was downloaded: $file"
              exit 1
            fi
          done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-minimum
          path: target/surefire-reports/

  minimum-version:
    name: Plugin-Mainversion matches build.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Compare pom.xml and build.xml
        run: |
          main_version=$(mvn -B -U -q help:evaluate -Dexpression=plugin.main.version -DforceStdout)
          ant_version=$(sed -n 's/.*name="plugin.main.version" value="\([0-9]*\)".*/\1/p' build.xml)
          if [ "$main_version" != "$ant_version" ]; then
            echo "::error::pom.xml plugin.main.version ($main_version) != build.xml ($ant_version)"
            exit 1
          fi

  format:
    name: Formatting (spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -U spotless:check
