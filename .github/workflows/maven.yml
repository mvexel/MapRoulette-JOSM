name: Standalone build

# Builds and tests the plugin outside the JOSM plugins SVN tree, against JOSM
# artifacts from https://josm.openstreetmap.de/repository/.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its superseded run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build and test (JOSM latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn -B -U verify -Dplugin.version="$(git describe --tags --always --dirty)"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MapRoulette.jar
          path: target/MapRoulette.jar

  minimum-version:
    # The Ant workflow builds and tests against the minimum JOSM revision (no jar is published for every revision),
    # so this only checks that the Maven and Ant builds declare the same Plugin-Mainversion.
    name: Plugin-Mainversion matches build.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Compare pom.xml and build.xml
        run: |
          main_version=$(mvn -B -U -q help:evaluate -Dexpression=plugin.main.version -DforceStdout)
          ant_version=$(sed -n 's/.*name="plugin.main.version" value="\([0-9]*\)".*/\1/p' build.xml)
          if [ "$main_version" != "$ant_version" ]; then
            echo "::error::pom.xml plugin.main.version ($main_version) != build.xml ($ant_version)"
            exit 1
          fi

  format:
    name: Formatting (spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -U spotless:check
